name: Vivoo
description: >-
  Vivoo is a wellness technology company offering science-backed, at-home urine
  test strips paired with a mobile app that turns results into personalized nutrition
  and lifestyle recommendations. Its lineup includes the 8-parameter Vivoo Wellness
  Test, an at-home UTI test, fertility/ovulation and vaginal pH tests, and a connected
  Smart Toilet. The direct-to-consumer store runs on Shopify and exposes a native
  agent-commerce surface: a published llms.txt/agents.md, a Universal Commerce Protocol
  (UCP) merchant profile at /.well-known/ucp, and a hosted UCP shopping MCP server
  for agent-driven catalog search, cart, and buyer-approved checkout. Backed by 500
  Global and Techstars.
